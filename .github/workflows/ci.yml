# ---------------------------------------------------------------------------
# CI — typecheck, build and the full test suite on every push to main and every
# pull request that targets it.
#
# The build step is not redundant with the typecheck. `tsc --noEmit` type-checks
# the source; `vite build` resolves and bundles it, which is a different failure
# surface — a platform-gated optional dependency missing from the lockfile
# (`@rollup/rollup-linux-x64-gnu`) type-checks perfectly on Windows and then
# fails the deploy on Linux. Building here, on Linux, is what turns that class of
# bug from "the deploy is broken" into "the PR is red".
#
# The integration suite needs a real, seeded Postgres — see server/vitest.config.ts.
# It is written to *skip* rather than fail when the database is unreachable, so
# that a fresh clone can still run the pure tiers. That is the right behaviour
# locally and a trap in CI: a connection problem would leave the run green while
# testing nothing. The "Verify the fixture" step below exists to close it.
# ---------------------------------------------------------------------------
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, build, test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Pinned to the same major the Render blueprint provisions, so a
        # behavioural difference cannot hide between CI and production.
        image: postgres:16-alpine
        env:
          POSTGRES_USER: velozity
          POSTGRES_PASSWORD: velozity
          POSTGRES_DB: velozity
        ports:
          - 5432:5432
        # Without a health check the job races the container and the first
        # Prisma command fails with P1001 on a database that is merely still
        # starting.
        options: >-
          --health-cmd "pg_isready -U velozity -d velozity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://velozity:velozity@localhost:5432/velozity?schema=public
      # Throwaway values for an ephemeral container that is destroyed with the
      # runner. They are here rather than in repository secrets precisely because
      # they are NOT secrets — nothing they sign outlives this job, and a
      # contributor reading the file should be able to see that at a glance.
      # The deployed secrets are generated by Render (see render.yaml) and exist
      # in no file anywhere.
      # They still have to satisfy the 32-character minimum in src/config/env.ts.
      JWT_ACCESS_SECRET: ci-only-access-key-not-a-real-credential-0001
      JWT_REFRESH_SECRET: ci-only-refresh-key-not-a-real-credential-0002

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Matches server/Dockerfile, so CI runs the runtime that ships.
          node-version: '22'
          cache: npm

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails loudly when the lockfile and the manifests disagree, which is the
      # whole point of running it here.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Apply migrations
        run: npm run db:deploy --workspace server

      - name: Seed the fixture
        run: npm run db:seed

      # The suite skips its integration tier when Postgres is unreachable. This
      # step turns that silent skip into a hard failure: if the fixture is not
      # there, the tests that matter most would not have run.
      #
      # `?schema=public` has to come off the URL first. It is a Prisma parameter,
      # not a libpq one, and psql rejects a URI query parameter it does not
      # recognise outright (`invalid URI query parameter: "schema"`) rather than
      # ignoring it. Same connection string, two dialects.
      - name: Verify the fixture
        run: |
          COUNT=$(psql "${DATABASE_URL%%\?*}" -tAc 'SELECT count(*) FROM "User";')
          echo "seeded users: $COUNT"
          if [ "$COUNT" -lt 7 ]; then
            echo "::error::Expected at least 7 seeded users; found $COUNT. The integration tests would have skipped."
            exit 1
          fi

      - name: Test
        # Explicit rather than relying on Vitest's default. `NODE_ENV` decides
        # whether the rate limiters are active (src/app.ts and
        # modules/auth/auth.routes.ts), so leaving it implicit would make the
        # suite's behaviour depend on a framework default.
        env:
          NODE_ENV: test
        run: npm test
