<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="Velozity — real-time client project dashboard with role-based access and a live activity feed."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Velozity · Agency Dashboard</title>
    <!--
      Theme, applied before first paint.

      This has to be a blocking inline script rather than something React does
      on mount: the stylesheet defaults to dark, so a stored *light* preference
      applied after hydration would show a dark frame first and then snap to
      light. One assignment here, ahead of the body, and the document is
      already correct when it is first painted.

      `system` is stored as the absence of the attribute, so the stylesheet's
      `prefers-color-scheme` block keeps working and the OS stays in charge.
      Wrapped in try/catch because reading localStorage throws outright in a
      private window with site data blocked, and a theme preference is not
      worth a blank page.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('velozity-theme');
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.setAttribute('data-theme', stored);
          }
        } catch (error) {
          /* No storage access — fall through to the OS preference. */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
